{% extends "base.html" %}

{% block title %}404 Not Found | AttendSync{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-5">
            <h1 class="display-1 fw-bold text-secondary">404</h1>
            <h3 class="fw-semibold text-dark mb-3">Page Not Found</h3>
            <p class="text-muted mb-4">
                The resource or endpoint you requested does not exist on this AttendSync server instance.
            </p>
            <div>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary px-4">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
