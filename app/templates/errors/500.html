{% extends "base.html" %}

{% block title %}500 Internal Error | AttendSync{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 p-5">
            <h1 class="display-1 fw-bold text-danger">500</h1>
            <h3 class="fw-semibold text-dark mb-3">Internal Server Error</h3>
            <p class="text-muted mb-4">
                The server encountered an unexpected error while processing your request. Please check application server logs.
            </p>
            <div>
                <a href="{{ url_for('main.index') }}" class="btn btn-outline-primary px-4">
                    <i class="bi bi-house-door me-1"></i> Back to Safety
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
